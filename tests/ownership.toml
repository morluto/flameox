schema_version = 1

# Every test file is listed exactly once.  The pytest support hook adds these
# markers to collected items, and tools/test.py uses the primary lane to build
# focused commands.  Process, provider, and performance markers describe test
# requirements without changing the primary owner.

[[ownership]]
owner = "adapters"
lane = "adapters"
paths = ["tests/adapters/test_coverage.py"]
markers = ["integration", "optional", "requires_coverage"]



[workloads.semantic]
argv = [
  "python", "semantic_workload.py", "{treatment}", "{backend}", "{dtype}",
  "{layout}", "{sequence_length}", "{state_mode}", "{case}",
]
cwd = "."
timeout_seconds = 10

[workloads.semantic.parameters]
treatment = ["reference", "candidate"]
backend = ["portable", "unavailable"]
dtype = ["float32", "float64"]
layout = ["contiguous", "strided"]
sequence_length = [4, 8]
state_mode = ["stateless", "initial_state"]
case = ["ordinary", "mismatch", "expected_rejection"]

[workloads.semantic.oracle]
strength = "contract_check"
argv = [
  "python", "semantic_oracle.py", "{treatment}", "{backend}", "{dtype}",
  "{layout}", "{sequence_length}", "{state_mode}", "{case}",
]
receipt_schema = "flameox.oracle-receipt.v1"

[experiments.semantic_matrix]
workload = "semantic"
design = "fixed_order"
blocks = 1
treatment_factor = "treatment"
combination_policy = "explicit"
max_trials = 8
analysis = "outcome"
outcome_goal = "absence_of_failure"
minimum_attempts = 1
maximum_attempts = 1
combinations = [
  {treatment = "reference", backend = "portable", dtype = "float32", layout = "contiguous", sequence_length = 4, state_mode = "stateless", case = "ordinary"},
  {treatment = "candidate", backend = "portable", dtype = "float32", layout = "contiguous", sequence_length = 4, state_mode = "stateless", case = "ordinary"},
  {treatment = "reference", backend = "portable", dtype = "float64", layout = "strided", sequence_length = 8, state_mode = "initial_state", case = "mismatch"},
  {treatment = "candidate", backend = "portable", dtype = "float64", layout = "strided", sequence_length = 8, state_mode = "initial_state", case = "mismatch"},
  {treatment = "reference", backend = "portable", dtype = "float32", layout = "strided", sequence_length = 4, state_mode = "stateless", case = "expected_rejection"},
  {treatment = "candidate", backend = "portable", dtype = "float32", layout = "strided", sequence_length = 4, state_mode = "stateless", case = "expected_rejection"},
  {treatment = "reference", backend = "unavailable", dtype = "float64", layout = "contiguous", sequence_length = 8, state_mode = "initial_state", case = "ordinary"},
  {treatment = "candidate", backend = "unavailable", dtype = "float64", layout = "contiguous", sequence_length = 8, state_mode = "initial_state", case = "ordinary"},
]

[experiments.semantic_matrix.factors]
treatment = ["reference", "candidate"]
backend = ["portable", "unavailable"]
dtype = ["float32", "float64"]
layout = ["contiguous", "strided"]
sequence_length = [4, 8]
state_mode = ["stateless", "initial_state"]
case = ["ordinary", "mismatch", "expected_rejection"]

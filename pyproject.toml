[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flameox"
version = "0.2.6"
description = "Runtime evidence that helps agents trace, profile, and burn down hotspots in application and native code, GPU kernels, and inference stacks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.9,<5",
    "coverage>=7.14,<8",
    "duckdb>=1.5.4,<1.6",
    "defusedxml>=0.7.1,<0.8",
    "ijson>=3.4,<4",
    "json5>=0.12,<1",
    "mcp==2.0.0",
    "mcp-types==2.0.0",
    "packaging>=24,<27",
    "pyperf>=2.10,<2.11",
    "pyarrow>=20,<26",
    "pydantic>=2.13.4,<2.14",
    "pytz>=2024.2",
    "questionary>=2.1,<3",
    "rfc8785==0.1.4",
    "tomlkit>=0.13,<1",
    "typer>=0.16,<1",
    "psutil>=7.0,<8",
]

[project.urls]
Homepage = "https://github.com/morluto/flameox"
Repository = "https://github.com/morluto/flameox"
Issues = "https://github.com/morluto/flameox/issues"

[project.optional-dependencies]
memory = ["memray>=1.17"]
torch = ["torch>=2.7"]
inference = ["aiperf>=0.12,<0.13"]
test = ["pytest>=8.3"]
trace = ["opentelemetry-proto>=1.44,<1.45", "perfetto>=0.57,<0.58", "protobuf>=5,<7"]
cpu = ["py-spy>=0.4.2,<0.5"]
all = [
    "aiperf>=0.12,<0.13",
    "memray>=1.17",
    "opentelemetry-proto>=1.44,<1.45",
    "perfetto>=0.57,<0.58",
    "protobuf>=5,<7",
    "py-spy>=0.4.2,<0.5",
    "torch>=2.7",
]
dev = [
    "deptry>=0.23",
    "import-linter>=2.2",
    "mypy>=1.15",
    "pip-audit>=2.9",
    "pytest>=8.3",
    "pytest-xdist>=3.8,<4",
    "pytest-cov>=6.1",
    "pyarrow-stubs>=20.0.0.20260625",
    "ruff>=0.11",
    "vulture>=2.14",
]

[project.scripts]
flameox = "flameox.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/flameox"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --durations=10 -p no:randomly -m 'not performance and not optional and not process'"
testpaths = ["tests"]
markers = [
    "unit: deterministic tests for one semantic owner",
    "integration: tests crossing two or more Flameox services",
    "process: tests that spawn, transport to, or cancel another process",
    "optional: tests requiring a provider or host capability outside the core install",
    "performance: representative local corpus performance acceptance checks",
    "serial: tests that must not share a process or host resource with another test",
    "requires_memray: requires the optional Memray provider",
    "requires_torch: requires the optional PyTorch provider",
]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["flameox"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C90", "TD"]
ignore = ["TD002"]

[tool.ruff.lint.per-file-ignores]
"src/flameox/mcp/server.py" = ["C901"]
"src/flameox/cli.py" = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.deptry.package_module_name_map]
opentelemetry-proto = "opentelemetry"
protobuf = "google"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["flameox"]

[[tool.mypy.overrides]]
module = [
    "ijson",
    "ijson.*",
    "memray",
    "memray.*",
    "opentelemetry.proto.*",
    "perfetto",
    "perfetto.*",
    "pyperf",
    "pyperf.*",
    "torch",
    "torch.*",
]
ignore_missing_imports = true

[tool.vulture]
min_confidence = 80
paths = ["src/flameox"]
ignore_names = ["cls", "setUp", "tearDown", "test_*", "Test*", "*_test"]
ignore_decorators = ["@app.command", "@property", "@router.*"]

[tool.importlinter]
root_package = "flameox"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Runtime core must not depend on transports"
type = "forbidden"
source_modules = ["flameox.stateless", "flameox.repository", "flameox.providers", "flameox.workers"]
forbidden_modules = ["flameox.cli", "flameox.mcp"]

[[tool.importlinter.contracts]]
name = "Providers and workers must not publish evidence"
type = "forbidden"
source_modules = ["flameox.providers", "flameox.workers"]
forbidden_modules = ["flameox.repository"]

[dependency-groups]
dev = [
    "types-psutil>=7.2,<8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flamo-diagnostics"
version = "0.1.0"
description = "Local runtime evidence CLI and MCP server for coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.9,<5",
    "duckdb>=1.5.4,<1.6",
    "mcp==2.0.0b2",
    "mcp-types==2.0.0b2",
    "numpy>=2.2,<3",
    "packaging>=24,<27",
    "portalocker>=3.2,<4",
    "platformdirs>=4.3,<5",
    "pytz>=2024.2",
    "pyarrow>=20,<26",
    "pydantic>=2.13.4,<2.14",
    "questionary>=2.1,<3",
    "scipy>=1.15,<2",
    "statsmodels>=0.14,<1",
    "tomli-w>=1.2,<2",
    "tomlkit>=0.13,<1",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
python = ["pyperf>=2.9"]
memory = ["memray>=1.17"]
torch = ["torch>=2.7"]
execution = ["coverage>=7.14,<8"]
trace = ["perfetto>=0.57,<0.58"]
cpu = ["py-spy>=0.4.2,<0.5"]
all = [
    "coverage>=7.14,<8",
    "memray>=1.17",
    "perfetto>=0.57,<0.58",
    "py-spy>=0.4.2,<0.5",
    "pyperf>=2.9",
    "torch>=2.7",
]
dev = [
    "hypothesis>=6.130",
    "import-linter>=2.2",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.1",
    "pyarrow-stubs>=20.0.0.20260625",
    "ruff>=0.11",
    "scipy-stubs>=1.18.0.1,<1.19",
    "vulture>=2.14",
]

[project.scripts]
flamo = "flamo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/flamo"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --durations=10"
testpaths = ["tests"]
markers = [
    "performance: representative local corpus performance acceptance checks",
]

[tool.coverage.run]
branch = true
source = ["flamo"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C90", "TD"]
ignore = ["TD002"]

[tool.ruff.lint.per-file-ignores]
"src/flamo/mcp/server.py" = ["C901"]
"src/flamo/cli.py" = ["C901"]
"src/flamo/application/capture.py" = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["flamo"]

[[tool.mypy.overrides]]
module = [
    "memray",
    "memray.*",
    "perfetto",
    "perfetto.*",
    "pyperf",
    "pyperf.*",
    "statsmodels",
    "statsmodels.*",
    "torch",
    "torch.*",
]
ignore_missing_imports = true

[tool.vulture]
min_confidence = 80
paths = ["src/flamo"]
ignore_names = ["setUp", "tearDown", "test_*", "Test*", "*_test"]
ignore_decorators = ["@app.command", "@property", "@router.*"]

[tool.importlinter]
root_package = "flamo"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Domain layer must not import application or infrastructure"
type = "forbidden"
source_modules = ["flamo.domain"]
forbidden_modules = ["flamo.application", "flamo.storage", "flamo.adapters", "flamo.cli", "flamo.mcp"]

[[tool.importlinter.contracts]]
name = "Storage must not import CLI, MCP, or adapters"
type = "forbidden"
source_modules = ["flamo.storage"]
forbidden_modules = ["flamo.cli", "flamo.mcp", "flamo.adapters"]

name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Static quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check src tests tools
      - run: uv run ruff format --check src tests tools
      - run: uv run mypy src tests tools

  tests:
    name: Deterministic tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra inference
      - name: Run deterministic tests
        env:
          COVERAGE_FILE: .coverage.deterministic
        run: >-
          uv run pytest -o addopts='' -ra -q
          -m 'not optional and not performance and not process'
          --cov=flameox --cov-report= --cov-fail-under=0
          tests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deterministic-coverage
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: .coverage.deterministic

  process-tests:
    name: Process-boundary tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra inference --extra trace
      - name: Run process-boundary tests
        env:
          COVERAGE_FILE: .coverage.process
        run: >-
          uv run pytest -o addopts='' -ra -q
          -m 'not optional and not performance and process'
          --cov=flameox --cov-report= --cov-fail-under=0
          tests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: process-coverage
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: .coverage.process

  coverage:
    name: Deterministic coverage
    needs: [tests, process-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-coverage"
          merge-multiple: true
      - run: uv run coverage combine .coverage.deterministic .coverage.process
      - run: uv run coverage report --fail-under=60
      - run: uv run coverage xml -o coverage.xml
      - uses: codecov/codecov-action@v5
        if: github.event_name == 'pull_request'
        with:
          files: coverage.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: deterministic-test-evidence
          if-no-files-found: error
          retention-days: 14
          path: coverage.xml

  architecture:
    name: Architecture and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run lint-imports
      - run: uv run vulture src/flameox --min-confidence 80
      - run: >-
          uv run deptry src
          --optional-dependencies-dev-groups dev,test
          --per-rule-ignores 'DEP002=aiperf|py-spy|pytest'
      - run: uv run pip-audit

  npm:
    name: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  optional-providers:
    name: Optional provider (${{ matrix.name }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: memray
            extra: memory
            marker: requires_memray
          - name: torch
            extra: torch
            marker: requires_torch
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra ${{ matrix.extra }}
      - run: >-
          uv run pytest -o addopts='' -ra -q
          -m '${{ matrix.marker }}'

  performance:
    name: Performance acceptance
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest -o addopts='' -ra -q -m performance

  required:
    name: Required checks
    if: always()
    needs: [quality, tests, process-tests, coverage, architecture, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every deterministic job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in ${RESULTS}; do
            test "${result}" = success
          done

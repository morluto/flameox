name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: full-extras
      - run: uv sync --extra dev --extra python --extra execution --extra memory --extra trace --extra cpu
      - run: uv run ruff check src tests tools
      - run: uv run ruff format --check src tests tools

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: full-extras
      - run: uv sync --extra dev --extra python --extra execution --extra memory --extra trace --extra cpu
      - run: uv run mypy src tests tools

  test-lanes:
    name: Test (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane:
          - core
          - storage
          - application
          - analysis
          - mcp
          - process
          - adapters
          - cli
          - security
          - golden
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: test-lanes
      - run: uv sync --extra dev
      - run: uv run python tools/test.py ${{ matrix.lane }}
      - uses: codecov/codecov-action@v5
        if: github.event_name == 'pull_request' && matrix.lane == 'core'
        with:
          files: .test-results/core-coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.lane }}
          include-hidden-files: true
          path: .test-results/

  optional-providers:
    name: Optional provider (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: coverage
            extra: execution
          - provider: memray
            extra: memory
          - provider: perfetto
            extra: trace
          - provider: pyspy
            extra: cpu
          - provider: torch
            extra: torch
          - provider: host
            extra: dev
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: optional-${{ matrix.extra }}
      - run: uv sync --extra dev --extra ${{ matrix.extra }}
      - run: uv run python tools/test.py optional-${{ matrix.provider }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-optional-${{ matrix.provider }}
          include-hidden-files: true
          path: .test-results/

  performance:
    name: Performance acceptance
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: performance
      - run: uv sync --extra dev
      - run: FLAMEOX_RUN_PERFORMANCE=1 uv run python tools/test.py performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-performance
          include-hidden-files: true
          path: .test-results/

  dead-code:
    name: Dead Code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: dev-only
      - run: uv sync --extra dev
      - run: uv run vulture src/flameox --min-confidence 80

  import-boundaries:
    name: Import Boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: dev-only
      - run: uv sync --extra dev
      - run: uv run lint-imports

  unused-deps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: dev-only
      - run: uv sync --extra dev
      - run: uv run deptry src
        continue-on-error: true

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: dev-only
      - run: uv sync --extra dev
      - run: uv run pip-audit

  npm:
    name: npm (lint & test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - run: npm ci
      - run: npx oxlint
      - run: npx oxfmt --check .
      - run: npm test

  collection:
    name: Collection & ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: collection
      - run: uv sync --extra dev
      - run: uv run flameox --help
      - run: uv run ruff check src tests tools
      - run: uv run mypy src tests tools
      - run: uv run python tools/test.py ownership
      - run: uv run python tools/test.py collection
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-collection
          include-hidden-files: true
          path: .test-results/

  build-summary:
    name: Build Performance Summary
    runs-on: ubuntu-latest
    needs:
      - lint
      - type-check
      - test-lanes
      - optional-providers
      - performance
      - dead-code
      - import-boundaries
      - unused-deps
      - security-audit
      - npm
      - collection
    if: always()
    timeout-minutes: 5
    steps:
      - name: Collect job durations
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "## Build Performance" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Duration | Started | Completed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          total_s=0
          job_count=0

          jobs_json=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[] | {name: .name, started_at: .started_at, completed_at: .completed_at, conclusion: .conclusion}')

          while IFS= read -r job; do
            name=$(echo "$job" | jq -r '.name')
            started=$(echo "$job" | jq -r '.started_at')
            completed=$(echo "$job" | jq -r '.completed_at')
            conclusion=$(echo "$job" | jq -r '.conclusion')

            [[ "$name" == "Build Performance Summary" ]] && continue
            [[ "$started" == "null" ]] && continue

            if [[ "$completed" != "null" ]]; then
              started_epoch=$(date -d "$started" +%s 2>/dev/null || echo 0)
              completed_epoch=$(date -d "$completed" +%s 2>/dev/null || echo 0)
              duration_s=$((completed_epoch - started_epoch))
              total_s=$((total_s + duration_s))
              job_count=$((job_count + 1))

              minutes=$((duration_s / 60))
              seconds=$((duration_s % 60))

              case "$conclusion" in
                success) status=":white_check_mark:" ;;
                failure) status=":x:" ;;
                skipped) status=":fast_forward:" ;;
                cancelled) status=":stop_sign:" ;;
                *) status=":grey_question:" ;;
              esac

              echo "| ${status} ${name} | ${minutes}m ${seconds}s | ${started} | ${completed} |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| :hourglass: ${name} | — | — | — |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < <(echo "$jobs_json" | jq -c '.')

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$job_count" -gt 0 ]]; then
            total_min=$((total_s / 60))
            total_sec=$((total_s % 60))
            avg_s=$((total_s / job_count))
            avg_min=$((avg_s / 60))
            avg_sec=$((avg_s % 60))
            echo "**Total CI wall-clock time:** ${total_min}m ${total_sec}s across ${job_count} jobs" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Average job duration:** ${avg_min}m ${avg_sec}s" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No completed jobs to report." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo ":package: **Cache strategy:** uv cache (full-extras / dev-only profiles), npm cache (package-lock.json)" >> "$GITHUB_STEP_SUMMARY"
